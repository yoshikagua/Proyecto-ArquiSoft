# Proyecto-ArquiSoft/nginx.conf
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Headers globales de endurecimiento (Hardening)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Canales de Entrada Seguros (HTTPS)
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;

        # Forzar protocolos modernos y seguros
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ─── CANAL HACIA TU FRONTEND PRINCIPAL (React Vite) ───
        location / {
            proxy_pass http://frontend:8080; # Redirección interna segura
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 =200 /index.html;

            # Soporte para WebSockets de Vite (Hot Module Replacement en desarrollo)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ─── CANAL HACIA TU API GATEWAY (Python) ───
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api-gateway:8000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── CANAL HACIA TU MICROFRONTEND DE DONACIONES (Next/Node) ───
        location /donations/ {
            proxy_pass http://mf_payments:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Redirección obligatoria de HTTP a HTTPS para asegurar todo el tráfico
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }
}
