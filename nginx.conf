worker_processes auto;

error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream api_gateway_cluster {
        least_conn;

        server api-gateway-1:8000 max_fails=3 fail_timeout=30s;
        server api-gateway-2:8000 max_fails=3 fail_timeout=30s;
        server api-gateway-3:8000 max_fails=3 fail_timeout=30s;

        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # Headers globales de endurecimiento
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/javascript;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ─── BLOQUE UNIFICADO (Atiende al WAF por 80 y 443) ───
    server {
        listen 80;
        listen 443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Solo redirigimos si el cliente original vino en HTTP puro.
        # Evita bucle de redirección cuando el WAF reenvía por el puerto 80.
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        # ─── ARCHIVOS ESTÁTICOS EXPLÍCITOS ───
        location = /favicon.ico {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors off;
        }

        location = /robots.txt {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors off;
        }

        location = /logo.png {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors off;
        }

        # ─── FRONTEND PRINCIPAL (React Vite) ───
        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 =200 /index.html;

            # Soporte WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ─── STORAGE / GRAPHQL ───
        location ^~ /api/storage {
            client_max_body_size 50M;

            proxy_request_buffering off;
            proxy_buffering off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            send_timeout 300s;

            proxy_pass http://api_gateway_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Server;

            # Requerido para que funcione keepalive en el upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── PAGOS ───
        location = /api/payments {
            return 308 /api/payments/;
        }

        location ^~ /api/payments/ {
            proxy_pass http://api_gateway_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Server;

            # Requerido para que funcione keepalive en el upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── API GATEWAY (general) ───
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/(.*) /$1 break;

            proxy_pass http://api_gateway_cluster;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Server;

            # Requerido para que funcione keepalive en el upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── MICROFRONTEND DE DONACIONES ───
        location /donations/ {
            proxy_pass http://mf_payments:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
        }
    }
}