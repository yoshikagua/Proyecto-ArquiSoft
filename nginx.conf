worker_processes auto;

error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    server {
        listen 80;
        # Escucha cualquier IP o dominio asignado por K3s/OCI
        server_name _ ; 

        # ─── STORAGE EXTERNO / MINIO ───
        location /scores/ {
            proxy_pass http://10.0.0.68:9000/scores/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── ARCHIVOS ESTÁTICOS EXPLICITOS ───
        location = /favicon.ico {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
        }

        location = /robots.txt {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
        }

        location = /logo.png {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
        }

        # ─── API GATEWAY: STORAGE ───
        location ^~ /api/storage {
            client_max_body_size 50M;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://api-gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── API GATEWAY: PAGOS ───
        location = /api/payments {
            return 308 /api/payments/;
        }

        location ^~ /api/payments/ {
            proxy_pass http://api-gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── API GATEWAY: CANAL GENERAL ───
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api-gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── MICROFRONTEND DE DONACIONES (Corregido a mf-payments con guion) ───
        location /donations/ {
            proxy_pass http://mf-payments:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        location /partituras {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 =200 /index.html;
        }

        # ─── CANAL HACIA TU FRONTEND PRINCIPAL ───
        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 =200 /index.html;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
