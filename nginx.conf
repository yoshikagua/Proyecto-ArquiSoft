# Proyecto-ArquiSoft/nginx.conf
worker_processes auto;

error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Headers globales de endurecimiento
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ─── BLOQUE UNIFICADO (Atiende al WAF por 80 y 443) ───
    server {
        listen 80;
        listen 443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 💡 CORRECCIÓN BUCLE REDIRECCIÓN:
        # Solo devolvemos un 301 si la petición original del cliente fue HTTP puro.
        # Si el WAF nos envía tráfico ya cifrado por el puerto 80, lo dejamos pasar.
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        # ─── CANAL HACIA TU FRONTEND PRINCIPAL (React Vite) ───
        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 =200 /index.html;

            # Soporte WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Optimización buffers
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ─── CANAL EXCLUSIVO PARA STORAGE / GRAPHQL ───
        location ^~ /api/storage {
            client_max_body_size 50M;
            
            proxy_request_buffering off;
            proxy_buffering off;
            
            proxy_pass http://api-gateway:8000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_hide_header Server;
        }

        # ─── CANAL GENERAL HACIA TU API GATEWAY ───
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://api-gateway:8000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Server;
        }

        # ─── CANAL HACIA TU MICROFRONTEND DE DONACIONES ───
        location /donations/ {
            proxy_pass http://mf_payments:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_buffering off;
        }
    }
}
