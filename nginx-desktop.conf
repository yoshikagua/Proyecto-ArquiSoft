# nginx-desktop.conf
# Proxy inverso exclusivo para la app de escritorio admin-desktop (Tauri)
# Canal seguro HTTPS en puerto 4443, independiente del proxy del front web.

worker_processes auto;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Headers de endurecimiento
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    server {
        listen 4443 ssl;
        server_name localhost;

        # Reutiliza los mismos certificados del proxy web
        ssl_certificate     /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ─── AUTH: el router usa prefix /auth (sin /api/), hay que reescribir ───
        location /api/auth/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://api-gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── STORAGE, NOTIFICATIONS, PAYMENTS: routers usan prefix /api/*, pasar tal cual ───
        location /api/ {
            proxy_pass http://api-gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
