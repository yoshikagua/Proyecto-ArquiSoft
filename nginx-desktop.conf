# nginx-desktop.conf
# Proxy inverso exclusivo para la app de escritorio admin-desktop (Tauri)
# Canal seguro HTTPS en puerto 4443, independiente del proxy del front web.

worker_processes auto;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Resolver DNS de Docker para evitar cacheo de IPs antiguas de contenedores.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    upstream api_gateway_upstream {
        zone api_gateway_upstream 64k;
        server api-gateway:8000 resolve;
    }

    # Headers de endurecimiento
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    server {
        listen 4443 ssl;
        server_name localhost;

        # Certificados exclusivos del proxy de escritorio (CN=localhost)
        ssl_certificate     /etc/nginx/certs-desktop/desktop.crt;
        ssl_certificate_key /etc/nginx/certs-desktop/desktop.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ─── AUTH: el router usa prefix /auth (sin /api/), hay que reescribir ───
        location /api/auth/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://api_gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── STORAGE, NOTIFICATIONS, PAYMENTS: routers usan prefix /api/*, pasar tal cual ───
        location /api/ {
            proxy_pass http://api_gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
