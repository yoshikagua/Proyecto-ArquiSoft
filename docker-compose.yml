services:
  postgres:
    image: postgres:15-alpine
    container_name: proyectosoft-postgres
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - main-network

  mailhog:
    image: mailhog/mailhog
    container_name: proyectosoft-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - main-network

  user-api:
    build:
      context: ./auth-api
    container_name: proyectosoft-user-api
    environment:
      DATABASE_URL: postgres://authuser:authpass@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-here-change-in-production}
      NOTIFICATION_URL: http://notification-producer:8000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - main-network

  payments-postgres:
    image: postgres:15-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments_db
    ports:
      - "5434:5432"
    volumes:
      - payments_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payments_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main-network

  payments_app:
    build:
      context: ./payments_app
      dockerfile: Dockerfile
    container_name: payments_app
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: payments-postgres
      DB_PORT: 5432
      DB_NAME: payments_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      FRONTEND_URL: http://localhost:8080
    ports:
      - "3002:3000"
    depends_on:
      payments-postgres:
        condition: service_healthy
    volumes:
      - ./payments_app:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - main-network

  mf_payments:
    build:
      context: ./mf_payments
      dockerfile: Dockerfile
    container_name: mf-payments-frontend
    environment:
      NODE_ENV: development
      PAYMENTS_API_URL: http://payments_app:3000
    ports:
      - "3003:3000"
    depends_on:
      - payments_app
    networks:
      - main-network

  mongo:
    image: mongo:7
    container_name: proyectosoft-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - main-network

  minio:
    image: minio/minio
    platform: linux/amd64
    container_name: proyectosoft-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - main-network

# --- NUEVO: Servicio especializado en Metadatos (GraphQL) ---
  metadata-api:
    build:
      context: ./metadata-api
    container_name: gateway-metadata-api
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: music_db
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-here-change-in-production}
      JWT_ALGORITHM: HS256
      BUCKET_NAME: scores
      MINIO_PUBLIC_URL: http://localhost:9000
    depends_on:
      mongo:
        condition: service_started
    networks:
    - main-network

  # --- NUEVO: Servicio especializado en Archivos (REST) ---
  files-api:
    build:
      context: ./files-api
    container_name: gateway-files-api
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      BUCKET_NAME: scores
    depends_on:
      minio:
        condition: service_started
    networks:
      - main-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: gateway-api-gateway
    environment:
      DEBUG: "True"
      GATEWAY_PORT: 8000
      USER_API_URL: http://user-api:3000
      NOTIFICATION_URL: http://notification-producer:8000
      METADATA_API_URL: http://metadata-api:8000/storage
      FILES_API_URL: http://files-api:8000
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      user-api:
        condition: service_started
      metadata-api:
        condition: service_started
      files-api:
        condition: service_started
      notification-producer:
        condition: service_started
    networks:
      - main-network

  frontend:
    build:
      context: ./Front-end
    container_name: proyectosoft-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - main-network

  # ===== Notification Module Services =====

  notification-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: notification-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main-network

  notification-postgres:
    image: postgres:15-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_DB: emails_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
      - ./Notification/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emails_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main-network

  notification-producer:
    build:
      context: ./Notification
      dockerfile: Dockerfile
    container_name: notification-producer
    command: ["php", "-S", "0.0.0.0:8000", "router.php"]
    ports:
      - "8002:8000"
    depends_on:
      notification-rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: notification-rabbitmq
      RABBITMQ_PORT: 5672
    networks:
      - main-network

  notification-worker:
    build:
      context: ./Notification
      dockerfile: Dockerfile
    container_name: notification-worker
    command: ["php", "email.php"]
    depends_on:
      notification-rabbitmq:
        condition: service_healthy
      notification-postgres:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: notification-rabbitmq
      RABBITMQ_PORT: 5672
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_NAME: emails_db
      DB_USER: postgres
      DB_PASSWORD: password
    networks:
      - main-network
    restart: unless-stopped

volumes:
  postgres_data:
  payments_postgres_data:
  mongo_data:
  minio_data:
  postgres_notification_data:

networks:
  main-network:
    driver: bridge
