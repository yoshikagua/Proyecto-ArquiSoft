# NOTE: Este compose es SOLO para desarrollo local y testing de auth-api
# Para ambiente completo con frontend y gateway, usar docker-compose.yml en la raíz del proyecto
# Uso: docker compose up -d (desde este directorio)
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./migrations/db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://authuser:authpass@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET}
      MAIL_SMTP_HOST: mailhog
      MAIL_SMTP_PORT: 1025
      MAIL_FROM: noreply@localhost
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres_data:
